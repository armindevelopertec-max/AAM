services:
  db:
    image: docker.io/library/postgres:16-alpine
    container_name: saas-pos-db
    environment:
      POSTGRES_USER: pos
      POSTGRES_PASSWORD: pos
      POSTGRES_DB: pos
    ports:
      # Puerto del host parametrizado para evitar conflictos (ver README §1)
      - "${AAM_DB_PORT:-5434}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pos -d pos"]
      interval: 5s
      timeout: 5s
      retries: 12

  mongodb:
    image: docker.io/library/mongo:7
    container_name: saas-pos-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: pos
      MONGO_INITDB_ROOT_PASSWORD: pos
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio:
    # Usar la imagen ya existente en local para evitar descargas
    image: quay.io/minio/minio:latest
    container_name: saas-pos-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9100:9000"
      - "9101:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS -o /dev/null http://localhost:9000/minio/health/live || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  db-data:
  mongo-data:
  minio-data: